AAABklEQVQDACQFKXscaKazAAAAAElFTkSuQmCC"><title>HeroArc</title><meta name="apple-mobile-web-app-title" content="HeroArc">
<style id="sBase">
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 40px;max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 2px 12px}
h1{font-size:24px;margin:0}small,.mut{color:var(--mut);font-size:12px}
.banner{background:#422006;color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;text-align:center}.ring svg{width:100%;max-width:140px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:26px}.ring .v span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}.row b{font-size:22px}
.bar{height:8px;background:#2B343E;border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;border-radius:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat b{font-size:28px;display:block}.chart{width:100%;height:90px}
.legend{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.nav button{background:var(--card);color:var(--ink);border:0;border-radius:12px;width:44px;height:44px;font-size:20px}
.nav button:disabled{opacity:.3}
.nav .mid{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;position:relative}
.nav input{background:var(--card);color:var(--ink);border:0;border-radius:12px;height:44px;padding:0 12px;font:inherit;color-scheme:dark;flex:1;min-width:0;text-align:center}
.nav .today{background:#DCE6F2;color:var(--blue);border-radius:12px;height:44px;width:auto;min-width:68px;padding:0 14px;border:0;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;text-align:center;flex:0 0 auto}
.nav .today:disabled{opacity:.3}
.goal{margin-bottom:14px}.goal:last-child{margin-bottom:0}.bar.big{height:14px;margin:8px 0 6px}.bal{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}.bal b{font-size:34px}.bal span{color:var(--mut)}.bal.def b{color:var(--green)}.bal.sur b{color:var(--amber)}.eq{color:var(--mut);font-size:13px;margin-bottom:10px}
html[data-theme="alchemist"] .alcol{display:none!important}
body[data-tab=trends] .alcol{display:block!important}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:0;padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);background:var(--tb-bg,#1a2028);border-top:1px solid var(--tb-bd,#2b343e);box-shadow:0 -6px 16px rgba(0,0,0,.18)}
#tabbar button{opacity:.78;flex:1;appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--tb-tx,#9fa9b5);font:600 12px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;padding:11px 0 9px;min-height:44px;cursor:pointer;position:relative}
#tabbar button[aria-selected=true]{color:var(--tb-on,#fff);opacity:1;font-weight:700}
#tabbar button[aria-selected=true]::after{content:'';position:absolute;left:28%;right:28%;top:0;height:3px;border-radius:2px;background:var(--tb-acc,#c48a60)}
#tabbar button i{font-style:normal;display:inline-block;min-width:16px;margin-left:5px;padding:1px 4px;border-radius:9px;background:var(--tb-acc,#c48a60);color:var(--tb-accx,#000);font-size:10px;letter-spacing:0;vertical-align:1px}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 76px)!important}
#thFab{bottom:calc(env(safe-area-inset-bottom) + 66px)!important}
#thBar{bottom:calc(env(safe-area-inset-bottom) + 66px)!important}
.card.clp>h2{cursor:pointer;margin-bottom:0!important;border-bottom:0!important}
.card.clp>h2::marker{content:''}
.card.clp.closed>*:not(h2):not(.cs){display:none!important}
.card .cs{display:none}
.card.clp .cs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:15px;line-height:1.25;cursor:pointer}
.card.clp:not(.closed) .cs{display:none}
.card.clp .cs b{font-weight:600}
.card.clp .cs u{text-decoration:none;opacity:.7;font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.card.clp:not(.closed)>h2::before{}
.card.clp .cv{display:inline-block;margin-left:8px;font-size:11px;opacity:.65;transition:transform .15s}
.card.clp:not(.closed) .cv{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.card.clp .cv{transition:none}}
.wa-sep{height:1px;margin:12px 0 10px;background:currentColor;opacity:.18}
/* ---- v50 touch targets + focus ---- */
html body .hb .hd{gap:6px}
html body .hb .hr{min-height:40px;padding-top:0;padding-bottom:0}
html body .hbd::before{content:'';position:absolute;top:-9px;bottom:-9px;left:-3px;right:-3px}
html body #rf::after{content:'';position:absolute;inset:-9px}
html body .bt h2.btt button{min-height:44px}

 const B=D.habits; if(B&&B.cfgPending&&!B._cfg){B._cfg=1;hbApplyCfg()}
 if(!B)return ''; if(!B.list.length&&!(typeof HE!=='undefined'&&HE.on)){return '<div class="card hb"><h2>Habits</h2><div class="mut">'+((B.archived||[]).length?'All habits are hidden.':'No habits yet. Tap Edit to add your first.')+'</div><div class="hm"><button type="button" class="hbe" data-hedit="1">Edit</button></div></div>'} hbPending();

 const ym=sel.slice(0,7),Y=+ym.slice(0,4),M=+ym.slice(5),dim=new Date(Y,M,0).getDate();

 const dn=B.list.filter(x=>hbOn(x.id,sel)).length,tot=B.list.length,all=dn===tot;

 o+=B.list.map(x=>'<div class="hr"><span class="hn">'+esc(x.n)+'</span><span class="hd">'+days.map(d=>{const on=hbOn(x.id,d);return '<button type="button" class="hbd'+(on?' on':'')+(d===sel?' td':'')+(HB.pop===x.id+'|'+d?' pop':'')+'" data-hb="'+x.id+'|'+d+'"'+(d>T?' disabled':'')+' aria-label="'+esc(x.n)+' '+d+(on?' done':'')+'" aria-pressed="'+on+'"></button>'}).join('')+'</span><span class="hct">'+mc(x.id)+'/'+upto+'</span></div>').join('');
 const when=sel===T?'Today':new Date(sel+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
 o+='<div class="ft"><span class="pips">'+B.list.map(x=>'<i class="'+(hbOn(x.id,sel)?'on':'')+'"></i>').join('')+'</span><b>'+when+' '+dn+' of '+tot+'</b></div>';
 o+='<div class="hm"><span class="ed"><button type="button" class="hbm" data-hbm="1" aria-expanded="'+HB.open+'">'+(HB.open?'Hide':'See month')+'</button><button type="button" class="hbe" data-hedit="1">Edit</button></span>'+(HB.open?'<span class="seg2"><button type="button" class="hbs'+(HB.view==='grid'?' on':'')+'" data-hbv="grid">Grid</button><button type="button" class="hbs'+(HB.view==='trend'?' on':'')+'" data-hbv="trend">Trend</button></span>':'<small class="mut">'+new Date(Y,M-1,1).toLocaleDateString(undefined,{month:'long'})+'</small>')+'</div>';
 if(HB.open&&HB.view==='grid'){
  const gl=n=>n.length>16?n.slice(0,15)+'\u2026':n,gh=Math.min(104,10+Math.max(...B.list.map(x=>gl(x.n).length))*6.2);
  o+='<div class="grid" style="grid-template-columns:22px repeat('+B.list.length+',1fr);width:100%"><span></span>'+B.list.map(x=>'<span class="gh" style="height:'+Math.round(gh)+'px" title="'+esc(x.n)+'">'+esc(gl(x.n))+'</span>').join('');
  for(let d=1;d<=dim;d++){const k=ym+'-'+hbPad(d);o+='<span class="gd">'+d+'</span>'+B.list.map(x=>'<button type="button" class="c'+(hbOn(x.id,k)?' on':'')+'" data-hb="'+x.id+'|'+k+'"'+(k>T?' disabled':'')+' aria-label="'+esc(x.n)+' '+k+'"></button>').join('')}
  o+='</div>';

function hbTrend(){
 const B=D.habits,T=D.date,ms=hbMonths(6),cur=ms[5];
 const mon=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString(undefined,{month:'short'}).slice(0,3);
 // overall this month
 let n=0,c=0;{const dim=+T.slice(8);for(let d=1;d<=dim;d++){const k=cur+'-'+hbPad(d);if(k<hbFirst())continue;B.list.forEach(x=>{n++;if(hbOn(x.id,k))c++})}}
 let o='<div class="tr6"><div class="tl">'+(n?'<b>'+Math.round(c/n*100)+'%</b> of boxes checked in '+mon(cur)+' so far':'Not enough days yet.')+'</div>';
 o+='<div class="ml">'+ms.map(m=>'<span>'+mon(m)+'</span>').join('')+'</div>';
 o+=B.list.map(x=>{const p=ms.map(m=>hbPct(x.id,m)),last=p[5],prev=p[4];
  const d=(last!=null&&prev!=null)?Math.round((last-prev)*100):null;
  return '<div class="trow"><span class="hn">'+esc(x.n)+'</span><span class="bars">'+p.map((v,i)=>v==null?'<i class="na" style="height:1px"></i>':'<i class="'+(i===5?'cur':'')+'" style="height:'+Math.max(2,Math.round(v*26))+'px"></i>').join('')+'</span><span class="pc">'+(last==null?'\u2014':Math.round(last*100)+'%')+'<small>'+(d==null?'':(d>0?'+':d<0?'\u2212':'')+Math.abs(d)+' vs '+mon(ms[4]))+'</small></span></div>'}).join('');
 // weekday pattern over the last 90 tracked days
 const from=shift(T,-89),first=hbFirst(),wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];let span=0;
 for(let i=0;i<90;i++){const k=shift(T,-i);if(k<from||k<first)continue;span++;const w=(new Date(k+'T12:00').getDay()+6)%7;B.list.forEach(x=>{wn[w]++;if(hbOn(x.id,k))wd[w]++})}
 if(span>=21){const r=wd.map((v,i)=>wn[i]?v/wn[i]:0),mx=Math.max(...r),mn=Math.min(...r),L='MTWTFSS',NM=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  o+='<div class="tl" style="margin-top:12px">By weekday, last '+span+' days: strongest <b>'+NM[r.indexOf(mx)]+'</b>, quietest <b>'+NM[r.indexOf(mn)]+'</b></div><div class="wk">'+r.map((v,i)=>'<div><i class="'+(v===mx?'hi':'')+'" style="height:'+Math.max(2,Math.round(v*34))+'px"></i>'+L[i]+'</div>').join('')+'</div>'}
 return o+'</div>';
}

function hbChime(){ if(typeof SND==='undefined'||!SND.on)return; const c=sndAudio(); if(!c)return; const t=c.currentTime;
 [523.25,659.25,783.99].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.12,t+i*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.35);o.connect(g);g.connect(c.destination);o.start(t+i*.08);o.stop(t+i*.08+.4)});
 try{navigator.vibrate&&navigator.vibrate([8,40,8])}catch(e){} }

function hbSyncNames(){document.querySelectorAll('.hb [data-hed]').forEach(el=>{const r=HE.rows[+el.dataset.hed];if(r)r.n=el.value})}
async function hbSave(){
 hbSyncNames();const bad=HE.rows.find(r=>!r.a&&!r.n.trim());if(bad){HE.msg='Give every habit a name, or hide it.';hbRedraw();return}
 if(!hbActiveN()){HE.msg='Keep at least one habit visible.';hbRedraw();return}
 const bn=HE.rows.find(r=>/^[=+@]/.test(r.n.trim()));if(bn){HE.msg='Names cannot start with = + or @.';hbRedraw();return}
 HE.rows.forEach(r=>{if(r.isNew&&!r.id){r.id=hbNewId(r.n.trim())}});
 const body={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),list:HE.rows.map(r=>({id:r.id,n:r.n.trim().slice(0,30),a:r.a?1:0}))};

  const B=D.habits;B.cfgPending=body;hbApplyCfg();HE.on=false;HE.busy=false;HE.msg='';view();if(typeof rfToast==='function')rfToast('Saved. The sheet updates within about 15 minutes.')}

function hbApplyCfg(){ // make D.habits.list/archived reflect the pending edit right away

 try{const a=getComputedStyle(document.documentElement).getPropertyValue('--t-acc').trim();const c=document.createElement('canvas').getContext('2d');c.fillStyle=a;c.fillRect(0,0,1,1);const p=c.getImageData(0,0,1,1).data;

/* ---------- Alchemist theme: hand-drawn meter + engraved mood faces ---------- */
const AL=()=>window.__TH==='alchemist';
function alRng(seed){let s=seed*2654435761>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function alMeter(name,f,seed){

 const SER={weight:{lab:'Weight',unit:' lb',dec:1,col:'var(--t-acc)'},sleep:{lab:'Sleep',unit:'',dec:0,col:'var(--t-acc2)'},readiness:{lab:'Readiness',unit:'',dec:0,col:'var(--t-acc)'}};
 const yp=(v,mn,mx)=>(84-((v-mn)/(mx-mn))*78)/90*100;
 const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
 const hideAll=()=>document.querySelectorAll('.cx .tip,.cx .gd,.cx .hd').forEach(e=>e.style.display='none');
 function attach(svg){
  if(svg.parentNode.classList&&svg.parentNode.classList.contains('cw'))return;
  const win=window.__WIN||[],n=win.length;if(n<2)return;
  const keys=(svg.dataset.s||'').split(',').filter(Boolean);if(!keys.length)return;
  const rng={};keys.forEach(k=>{const v=win.map(x=>x[k]).filter(x=>x!=null);
   rng[k]=k==='weight'?{mn:(v.length?Math.min(...v):0)-.5,mx:(v.length?Math.max(...v):1)+.5}:{mn:50,mx:100}});
  const wrap=document.createElement('div');wrap.className='cw';svg.parentNode.insertBefore(wrap,svg);wrap.appendChild(svg);
  const ov=document.createElement('div');ov.className='cx';wrap.appendChild(ov);
  const gd=document.createElement('div');gd.className='gd';ov.appendChild(gd);
  const tip=document.createElement('div');tip.className='tip';ov.appendChild(tip);
  const hds=keys.map(k=>{const e=document.createElement('div');e.className='hd';e.style.borderColor=SER[k].col;e.style.setProperty('--c',SER[k].col);ov.appendChild(e);return e});
  // persistent dots on every real data point
  keys.forEach(k=>win.forEach((p,i)=>{if(p[k]==null)return;const d=document.createElement('div');d.className='pt';d.style.left=(i/(n-1)*100)+'%';d.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%';d.style.background=SER[k].col;ov.appendChild(d)}));
  function show(ev){
   const r=wrap.getBoundingClientRect();let f=(ev.clientX-r.left)/r.width;f=Math.max(0,Math.min(1,f));
   let best=-1,bd=9;win.forEach((p,i)=>{if(!keys.some(k=>p[k]!=null))return;const dd=Math.abs(i/(n-1)-f);if(dd<bd){bd=dd;best=i}});
   if(best<0)return;const p=win[best],x=best/(n-1)*100;
   gd.style.display='block';gd.style.left=x+'%';
   keys.forEach((k,j)=>{const h=hds[j];if(p[k]==null){h.style.display='none';return}h.style.display='block';h.style.left=x+'%';h.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%'});
   tip.innerHTML='<b>'+fd(p.d)+'</b>'+keys.map(k=>p[k]==null?'':'<span><i style="background:'+SER[k].col+'"></i>'+SER[k].lab+' <em>'+Number(p[k]).toFixed(SER[k].dec)+SER[k].unit+'</em></span>').join('');
   tip.style.display='block';const tw=tip.offsetWidth,W=r.width;let left=x/100*W-tw/2;left=Math.max(0,Math.min(W-tw,left));
   tip.style.left=left+'px';tip.style.top='-8px';tip.style.transform='translateY(-100%)';
  }
  wrap.addEventListener('pointerdown',e=>{hideAll();show(e)});
  wrap.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch'||e.pointerType==='pen')show(e)});
  wrap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideAll()});
  // keep the day-to-day swipe from firing while a finger is on a chart
  ['touchstart','touchend','touchmove'].forEach(t=>wrap.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
 }
 const run=()=>document.querySelectorAll('#app svg.chart').forEach(attach);
 document.addEventListener('pointerdown',e=>{if(!e.target.closest||!e.target.closest('.cw'))hideAll()});
 new MutationObserver(run).observe(document.getElementById('app'),{childList:true});run();
})();


/* ---------- Manual refresh: re-fetch the snapshot in place (keeps the selected day, scroll and any workout in progress) ---------- */
function rfToast(t){const e=document.getElementById('rfToast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(rfToast._t);rfToast._t=setTimeout(()=>e.classList.remove('on'),1900)}
function rfFetch(){return fetch('api/data?'+Date.now(),{credentials:'same-origin',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
function rfApply(j){D=j; if(D.training){try{applyPending()}catch(e){}} view()}
function refreshApp(){
 const b=document.getElementById('rf'); if(!b||b.classList.contains('spin'))return;
 b.classList.add('spin'); b.setAttribute('aria-busy','true'); const t0=Date.now(), prev=D&&D.updated;
 const done=(msg)=>{rfToast(msg);setTimeout(()=>{b.classList.remove('spin');b.removeAttribute('aria-busy')},Math.max(0,600-(Date.now()-t0)))};
 const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 // 1) ask the home machine to pull Oura now (harmless if it cannot: we still reload what is there)
 fetch('api/sync-request',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-heroarc':'1'},body:JSON.stringify({id:id})})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(()=>null)
  .then(req=>{
   if(!req||!req.id)return rfFetch().then(j=>{rfApply(j);done('Reloaded. Oura sync is not available right now.')});
   // show what is already there at once, then wait for the home machine (it checks once a minute) and refresh again when it reports back
   rfFetch().then(j=>rfApply(j)).catch(()=>{});
   rfToast('Syncing Oura... about a minute');
   const t1=Date.now(); const poll=()=>rfFetch().then(j=>{
     const sd=j.syncDone;
     if(sd&&sd.id===req.id){rfApply(j);done(sd.ok?(j.updated&&j.updated!==prev?'Synced. Updated '+j.updated:'Synced. Already up to date'):'Oura did not sync. Showing the latest saved data.');return}
     if(Date.now()-t1>80000){done('Oura sync is taking a while. Showing the latest; try again in a minute.');return}
     setTimeout(poll,4000)}).catch(()=>done('Could not refresh. Close and reopen the app.'));
   setTimeout(poll,4000);
  });
}
function rfInit(){
 const hd=document.querySelector('header'); if(!hd||document.getElementById('rf'))return;
 const b=document.createElement('button'); b.id='rf'; b.type='button'; b.setAttribute('aria-label','Refresh data');
 b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>';
 b.addEventListener('click',e=>{e.stopPropagation();refreshApp()}); hd.insertBefore(b,hd.firstChild);
 const t=document.createElement('div'); t.id='rfToast'; t.setAttribute('role','status'); document.body.appendChild(t);
}

 plastic:[190,110,18,3800,.5], keycap:[260,160,14,5200,.45], metal:[420,280,10,7000,.4], chunk:[120,70,26,2200,.6],
 soft:[170,100,22,2600,.35], pixel:[880,660,6,9000,.18], wood:[150,90,28,1800,.5], glass:[1200,900,8,9000,.16]};
const SND_MAP={alchemist:'wood',tx_dash:'metal',beige84:'keycap',phosphor:'pixel',synthoffice:'glass',wireframe:'pixel',y2korange:'glass',mall99:'soft',cargo:'soft',archive:'wood',colorarchive:'soft',pastelfiles:'soft',cardfile:'wood',rotary:'metal',keypad:'metal',creamstack:'plastic',rams:'plastic',radar:'chunk',synthmod:'plastic',pcb:'metal',olivekeys:'keycap',typewriter:'chunk',walkman:'plastic',boombox:'chunk',discprism:'glass',console:'pixel',citypop:'soft',noodle:'soft',drawer:'glass',craftcan:'metal',keyboard:'keycap',manga:'soft',gameboy:'pixel',vhs:'chunk',win95:'plastic',memphis:'soft',streetfighter:'pixel',armani2:'soft',cyberpunk:'glass',greekgod:'metal',system:'glass',night:'soft',hifi:'plastic',mecha:'chunk',steam:'metal',anime90:'soft',vhd_night:'wood',vhd_amano:'soft'};
function sndAudio(){if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(SND.ctx.state==='suspended')SND.ctx.resume(); return SND.ctx}
function sndClick(up){
 if(!SND.on)return; const c=sndAudio(); if(!c)return;
 const p=SND_FAM[SND_MAP[window.__TH||'night']||'plastic']||SND_FAM.plastic, t=c.currentTime, f=up?p[1]:p[0], g=p[4]*(up?.55:1);
 const o=c.createOscillator(), og=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.45),t+.05);
 og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(g,t+.002); og.gain.exponentialRampToValueAtTime(.0001,t+.06); o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+.07);
 const n=Math.floor(c.sampleRate*p[2]/1000), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const s=c.createBufferSource(); s.buffer=b; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=p[3]; const ng=c.createGain(); ng.gain.value=g*.9; s.connect(lp); lp.connect(ng); ng.connect(c.destination); s.start(t);
}

/* ============ Goals calculator + weight entry ============ */
const GS={sex:'female',age:'',height:'',weight:'',activity:'light',goal:'maintain',kcal:'',protein:'',msg:'',ok:false,open:false,busy:false,loaded:false};
const GACT={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,'very active':1.9};
function gCalc(s){ // Mifflin-St Jeor, estimate only
  const kg=s.weight/2.2046,cm=s.height*2.54,bmr=10*kg+6.25*cm-5*s.age+(s.sex==='male'?5:-161);
  let k=bmr*GACT[s.activity]; k+= s.goal==='lose'?-Math.min(500,k*.2):(s.goal==='gain'?300:0);
  k=Math.max(k,s.sex==='male'?1500:1200);
  const pf=s.goal==='lose'?0.9:(s.goal==='gain'?0.85:0.75);
  return {bmr:Math.round(bmr),kcal:Math.round(k/10)*10,protein:Math.round(s.weight*pf)};
}
function gLoad(){ // seed the form once from the snapshot (and any goals saved a moment ago)
  if(GS.loaded||!D)return; GS.loaded=true; const P=D.goalsPending||(D.goalsForm||null), G=D.goals||{};
  const f=P||{}; ['sex','age','height','weight','activity','goal'].forEach(k=>{if(f[k]!=null&&f[k]!=='')GS[k]=f[k]});
  GS.kcal=(P&&P.kcal)||G.kcal||''; GS.protein=(P&&P.protein)||G.protein||'';
  if(!GS.weight){const ws=Object.values(D.days||{}).map(x=>x.weight).filter(x=>x!=null);if(ws.length)GS.weight=ws[ws.length-1]}
}
function goalsCard(){
  gLoad(); const G=D.goals||{}, set=!!(G.kcal&&G.protein&&G.goalsSet);
  const sel=(k,opts)=>'<select data-gf="'+k+'">'+opts.map(o=>'<option value="'+o+'"'+(GS[k]===o?' selected':'')+'>'+o[0].toUpperCase()+o.slice(1)+'</option>').join('')+'</select>';
  const inp=(k,ph)=>'<input data-gf="'+k+'" inputmode="decimal" placeholder="'+ph+'" value="'+(GS[k]===''?'':GS[k])+'">';
  const head='<div class="card gl"><h2>Goals</h2>';
  const sum='<div class="big"><div><span class="mut">Calories</span><br><b>'+(G.kcal?fmt(G.kcal):'—')+'</b></div><div><span class="mut">Protein (g)</span><br><b>'+(G.protein?fmt(G.protein):'—')+'</b></div></div>';
  if(!GS.open) return head+sum+(set?'':'<div class="est">These are starter numbers. Tap Set goals to calculate yours.</div>')+'<div class="acts"><button type="button" data-gopen="1">'+(set?'Edit goals':'Set goals')+'</button></div></div>';
  const c=(GS.age&&GS.height&&GS.weight)?gCalc(GS):null;
  return head+sum+
   '<div class="g2"><div><label>Sex</label>'+sel('sex',['female','male'])+'</div><div><label>Age</label>'+inp('age','years')+'</div></div>'+
   '<div class="g2"><div><label>Height (inches)</label>'+inp('height','e.g. 65')+'</div><div><label>Weight (lb)</label>'+inp('weight','e.g. 150')+'</div></div>'+
   '<label>Activity</label>'+sel('activity',['sedentary','light','moderate','active','very active'])+
   '<label>Goal</label>'+sel('goal',['lose','maintain','gain'])+
   '<div class="acts"><button type="button" data-gcalc="1">Calculate</button></div>'+
   (c?'<div class="est">Estimate: about '+fmt(c.kcal)+' kcal and '+c.protein+' g protein a day (resting burn about '+fmt(c.bmr)+'). It is a starting point, not medical advice.</div>':'<div class="est">Fill in age, height and weight, then tap Calculate.</div>')+
   '<label>Your calorie goal</label>'+inp('kcal','kcal')+'<label>Your protein goal (g)</label>'+inp('protein','grams')+
   '<div class="msg" style="color:'+(GS.ok?'var(--green)':'var(--amber)')+'">'+(GS.msg||'')+'</div>'+
   '<div class="acts"><button type="button" data-gcancel="1">Close</button><button type="button" data-gsave="1">Save goals</button></div></div>';
}
async function gSave(){
  if(GS.busy)return;
  const f={id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sex:GS.sex,age:+GS.age,height:+GS.height,weight:+GS.weight,activity:GS.activity,goal:GS.goal,kcal:+GS.kcal,protein:+GS.protein};
  const bad=!(f.age>=14&&f.age<=100)?'Age looks off.':!(f.height>=48&&f.height<=90)?'Height should be in inches (48 to 90).':!(f.weight>=70&&f.weight<=500)?'Weight looks off.':!(f.kcal>=1000&&f.kcal<=6000)?'Calories should be 1,000 to 6,000.':!(f.protein>=40&&f.protein<=400)?'Protein should be 40 to 400 g.':'';
  if(bad){GS.msg=bad;GS.ok=false;redrawGoals();return}
  GS.busy=true;
  try{const r=await fetch('api/goals',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-heroarc':'1'},body:JSON.stringify(f)});if(!r.ok)throw new Error(r.status);
    D.goals=Object.assign({},D.goals,{kcal:f.kcal,protein:f.protein,goalsSet:true});GS.msg='Saved. Your app and food log use these now.';GS.ok=true;GS.open=false}
  catch(e){GS.msg="Couldn't save. Check your connection and try again.";GS.ok=false}
  GS.busy=false;view();
}
function redrawGoals(){const el=document.querySelector('.gl');if(!el)return;const t=document.createElement('div');t.innerHTML=goalsCard();el.replaceWith(t.firstElementChild)}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.gf){GS[t.dataset.gf]=t.value;if(t.tagName==='SELECT')redrawGoals()}});
document.addEventListener('click',e=>{const t=e.target&&e.target.closest?e.target:null;if(!t)return;
  if(t.closest('[data-gopen]')){GS.open=true;GS.msg='';view();return}
  if(t.closest('[data-gcancel]')){GS.open=false;GS.msg='';view();return}
  if(t.closest('[data-gcalc]')){if(GS.age&&GS.height&&GS.weight){const c=gCalc(GS);GS.kcal=c.kcal;GS.protein=c.protein;GS.msg='Filled in. Change the numbers if you like, then save.';GS.ok=true}else{GS.msg='Add age, height and weight first.';GS.ok=false}redrawGoals();return}
  if(t.closest('[data-gsave]')){gSave();return}
});

/* ============ Training plan editor (saved to the Plan tab of the sheet) ============ */
const PE={on:false,rows:[],msg:'',ok:false,busy:false};
function peFromProgram(){const W=(D.training&&D.training.program&&D.training.program.workouts)||[];
  return W.map(w=>({name:w.name,ex:(w.exercises||[]).map(x=>({n:x.n,sets:x.sets||'',star:(w.keyLifts||[]).some(k=>k.toLowerCase()===x.n.toLowerCase())?1:0}))}))}
function peOpen(){PE.rows=peFromProgram();if(!PE.rows.length)PE.rows=[{name:'',ex:[{n:'',sets:'',star:0}]}];PE.on=true;PE.msg='';trRedrawPlan()}
function trRedrawPlan(){const el=document.querySelector('.card.tr');if(!el)return;const t=document.createElement('div');t.innerHTML=trainCard(sel);el.replaceWith(t.firstElementChild)}
function planEditor(){
  const eh=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  let o='<div class="card tr pe-ed"><h2>Training plan</h2><div class="pe-hint">Name your workouts, add exercises with sets and reps (like 3 x 10), and tap the star on the lifts you want to track a max for. Your logged history is kept if you change the plan.</div>';
  PE.rows.forEach((w,wi)=>{
    o+='<div class="pe-w"><div class="pe-h"><input data-pw="'+wi+'" maxlength="30" placeholder="Workout name (e.g. Upper)" value="'+eh(w.name)+'" aria-label="Workout name">'
      +'<button type="button" data-pm="w|'+wi+'|-1" aria-label="Move workout up">\u2191</button><button type="button" data-pm="w|'+wi+'|1" aria-label="Move workout down">\u2193</button><button type="button" data-pd="w|'+wi+'" aria-label="Remove workout">\u2715</button></div>';
    w.ex.forEach((x,xi)=>{o+='<div class="pe-x"><input class="pn" data-px="'+wi+'|'+xi+'|n" maxlength="40" placeholder="Exercise" value="'+eh(x.n)+'" aria-label="Exercise name"><input class="ps" data-px="'+wi+'|'+xi+'|sets" maxlength="20" placeholder="3 x 10" value="'+eh(x.sets)+'" aria-label="Sets and reps">'
      +'<button type="button" class="'+(x.star?'on':'')+'" data-ps="'+wi+'|'+xi+'" aria-label="Track a max for this lift">'+(x.star?'\u2605':'\u2606')+'</button>'
      +'<button type="button" data-pm="x|'+wi+'|'+xi+'|-1" aria-label="Move up">\u2191</button><button type="button" data-pd="x|'+wi+'|'+xi+'" aria-label="Remove exercise">\u2715</button></div>'});
    o+='<button type="button" data-pa="x|'+wi+'">+ Exercise</button></div>'});
  o+='<button type="button" data-pa="w">+ Workout</button><div class="pe-msg" style="color:'+(PE.ok?'var(--green)':'var(--amber)')+'">'+(PE.msg||'')+'</div>'
    +'<div class="pe-b"><button type="button" data-pe="cancel">Cancel</button><button type="button" data-pe="save">Save plan</button></div></div>';
  return o}
function peNorm(){return PE.rows.map(w=>({name:w.name.trim(),ex:w.ex.map(x=>({n:x.n.trim(),sets:(x.sets||'').trim(),star:x.star?1:0})).filter(x=>x.n)})).filter(w=>w.name||w.ex.length)}
async function peSave(){
  if(PE.busy)return; const W=peNorm(); let bad='';
  if(!W.length)bad='Add at least one workout.';
  const names=new Set();
  W.forEach(w=>{if(bad)return;if(!w.name)bad='Give every workout a name.';else if(/^[=+@]/.test(w.name))bad='Names cannot start with = + or @.';else if(names.has(w.name.toLowerCase()))bad='Two workouts have the same name.';names.add(w.name.toLowerCase());
    if(!bad&&!w.ex.length)bad='"'+w.name+'" needs at least one exercise.';const s=new Set();
    w.ex.forEach(x=>{if(bad)return;if(/^[=+@]/.test(x.n)||/^[=+@]/.test(x.sets))bad='Entries cannot start with = + or @.';else if(s.has(x.n.toLowerCase()))bad='"'+x.n+'" appears twice in '+w.name+'.';s.add(x.n.toLowerCase())});
    if(!bad&&w.ex.filter(x=>x.star).length>8)bad='Star at most 8 lifts per workout.'});
  if(bad){PE.msg=bad;PE.ok=false;trRedrawPlan();return}
  PE.busy=true;
  try{const r=await fetch('api/plan',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-heroarc':'1'},body:JSON.stringify({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),workouts:W})});if(!r.ok)throw new Error(r.status);
    peApply({workouts:W});PE.on=false;PE.msg='';if(typeof rfToast==='function')rfToast('Plan saved.')}
  catch(e){PE.msg="Couldn't save. Check your connection and try again.";PE.ok=false}
  PE.busy=false;view()}
function peApply(p){D.training=D.training||{log:[],pending:[]};D.training.program={workouts:p.workouts.map(w=>({name:w.name,exercises:w.ex.map(x=>({n:x.n,sets:x.sets,type:''})),keyLifts:w.ex.filter(x=>x.star).map(x=>x.n)})),keyLifts:[]}}
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.pw!==undefined)PE.rows[+t.dataset.pw].name=t.value;
  else if(t.dataset.px){const p=t.dataset.px.split('|');PE.rows[+p[0]].ex[+p[1]][p[2]]=t.value}});
document.addEventListener('click',e=>{const t=e.target&&e.target.closest?e.target:null;if(!t)return;
  let b;
  if(b=t.closest('[data-pe]')){const v=b.dataset.pe;if(v==='open')peOpen();else if(v==='cancel'){PE.on=false;PE.msg='';view()}else if(v==='save')peSave();return}
  if(!PE.on)return;
  if(b=t.closest('[data-ps]')){const p=b.dataset.ps.split('|'),x=PE.rows[+p[0]].ex[+p[1]];x.star=x.star?0:1;trRedrawPlan();return}
  if(b=t.closest('[data-pa]')){const p=b.dataset.pa.split('|');if(p[0]==='w'){if(PE.rows.length<7)PE.rows.push({name:'',ex:[{n:'',sets:'',star:0}]})}else{const w=PE.rows[+p[1]];if(w.ex.length<14)w.ex.push({n:'',sets:'',star:0})}trRedrawPlan();return}
  if(b=t.closest('[data-pd]')){const p=b.dataset.pd.split('|');if(p[0]==='w'){if(PE.rows.length>1)PE.rows.splice(+p[1],1)}else{const w=PE.rows[+p[1]];if(w.ex.length>1)w.ex.splice(+p[2],1)}trRedrawPlan();return}
  if(b=t.closest('[data-pm]')){const p=b.dataset.pm.split('|');const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
    if(p[0]==='w')mv(PE.rows,+p[1],+p[2]);else mv(PE.rows[+p[1]].ex,+p[2],+p[3]);trRedrawPlan();return}
});
/* a plan saved a moment ago but not yet in the sheet rides along on /api/data */
(function(){const v=window.view;window.view=function(){try{if(D&&D.planPending&&!D._pl){D._pl=1;peApply(D.planPending)}}catch(e){}return v.apply(this,arguments)}})();
</script></body></html>
